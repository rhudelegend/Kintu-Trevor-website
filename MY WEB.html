<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kintu Trevor - Welcome Page</title>

  <style>
    /* Moving Gradient Background */
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;

      background: linear-gradient(270deg, #ff00c8, #007bff, #00ffea, #ff7b00);
      background-size: 800% 800%;
      animation: moveColors 15s ease infinite;
    }

    @keyframes moveColors {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Animated Glowing Card */
    .card {
      position: relative;
      width: 350px;
      padding: 25px;
      text-align: center;
      color: white;

      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(15px);
      border-radius: 18px;
      overflow: hidden;
    }

    /* Glow Border Animation */
    .card::before {
      content: "";
      position: absolute;
      top: -5px;
      left: -5px;
      right: -5px;
      bottom: -5px;
      z-index: -1;
      background: linear-gradient(270deg, #ff00ff, #00c8ff, #00ff6a, #ffdd00, #ff0077);
      background-size: 400% 400%;
      filter: blur(20px);
      border-radius: 20px;
      animation: glowMove 6s linear infinite;
    }

    @keyframes glowMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card h1 {
      margin-bottom: 10px;
      font-size: 22px;
    }

    .card p {
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      background: white;
      color: #333;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 16px;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn:hover {
      background: #d6d6d6;
    }
  </style>

</head>
<body>

  <div class="card">
    <h1>Welcome to Kintu Trevor's Website</h1>
    <p>We’re glad to have you here!</p>

    <!-- Button linked to your form page -->
    <a href="form.html" class="btn">Visit Page</a>
  </div>

</body>
</html>
